[project]
name = "sonipy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex Robinson", email = "50270256+Alexdoesvoices@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyinstaller>=6.22.3",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.8",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
dev = "sonipy:main"
dev_window = "sonipy.window:program_window"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
